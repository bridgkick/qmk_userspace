name: Compile Preonic rev2

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboards/preonic/rev2/keymaps/bridgkick/**'
      - '.github/workflows/preonic.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'keyboards/preonic/rev2/keymaps/bridgkick/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install QMK CLI
      run: pip install qmk

    - name: QMK setup
      run: |
        qmk setup --yes
        qmk config user.overlay_dir=$(realpath .)

    - name: Install keymap-drawer
      run: pip install keymap-drawer

    - name: Create layouts directory
      run: mkdir -p layouts

    - name: Compile Preonic rev2
      run: qmk compile -kb preonic/rev2 -km bridgkick

    - name: Rename firmware
      run: |
        find . -name "*.hex" -path "*/preonic/*" -type f | head -1 | xargs -I {} mv {} preonic_rev2_bridgkick.hex

    - name: Generate Layout SVG
      run: |
        keymap_file="keyboards/preonic/rev2/keymaps/bridgkick/keymap.c"
        keymap-drawer parse -c "$keymap_file" > layouts/preonic.yaml
        keymap-drawer draw layouts/preonic.yaml > layouts/preonic.svg

    - name: Commit layout update
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add layouts/preonic.svg layouts/preonic.yaml
        if ! git diff --cached --quiet; then
          git commit -m "auto: update Preonic layout SVG [skip ci]"
          git push
        fi

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          preonic_rev2_bridgkick.hex
          layouts/preonic.svg
        tag_name: preonic-${{ github.run_number }}
        body: |
          ## Preonic rev2 Firmware Build
          **Commit:** ${{ github.sha }}
          
          - `preonic_rev2_bridgkick.hex` — ATmega32u4 firmware
          - `preonic.svg` — Layout diagram
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: preonic-firmware
        path: |
          preonic_rev2_bridgkick.hex
          layouts/preonic.svg
